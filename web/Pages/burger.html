<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TAZ Fast Food, hecho en Colombia. Arma tu pizza, burguer, perro caliente, salchipapa o mazorcada y pídela a tu puerta.">
<link rel="icon" href="assets/logo.webp" type="image/webp">
<title>Burguer · TAZ Fast Food</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="burger.css">
</head>
<body data-page="burger">
<header>
  <span class="lg" id="hlogo" role="img" aria-label="Logo TAZ"></span>
  <nav id="nav"></nav>
  <button class="cartbtn" id="openCart" aria-label="Abrir carrito">🛒 <span class="ct">Carrito</span> <b id="cnt">0</b></button>
</header>
<main id="app"></main>
<footer>TAZ Fast Food · Hecho en Colombia, servido en San José, California<br>63 N Keeble Ave, San Jose, CA 95126 · Delivery +1 (650) 683-0906</footer>
<div id="ov"></div>
<aside id="cart" aria-label="Carrito">
  <header><h2>Tu pedido</h2><button class="x" id="closeCart" aria-label="Cerrar carrito">Cerrar ✕</button></header>
  <div class="items" id="items"></div>
  <div class="foot"><div class="row"><span>Total</span><span id="ctot">$0.00</span></div><button class="cta" id="send">Enviar pedido por WhatsApp</button></div>
</aside>
<div class="toast" id="toast">Agregado al carrito</div>

<script src="burger.js"></script>
</body>
</html>
