# =========================================================
#  Nginx: redirige HTTP -> HTTPS y sirve la app.
#  Copiar a /etc/nginx/sites-available/tazmania y enlazar:
#    ln -s /etc/nginx/sites-available/tazmania /etc/nginx/sites-enabled/
#  Cambiar "tudominio.com" por tu dominio real.
#  Los certificados los genera: certbot --nginx -d tudominio.com -d www.tudominio.com
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tudominio.com www.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend (archivos estáticos)
    root /var/www/tazmania;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend Node.js (ajustar el puerto si es otro)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
